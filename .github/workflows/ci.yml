name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cvf_prueba
          POSTGRES_USER: cvf_admin
          POSTGRES_PASSWORD: clave-local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cvf_admin -d cvf_prueba"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revisar tipos
        run: pnpm typecheck
      - name: Pruebas (incluye la prueba de aislamiento entre empresas)
        run: pnpm test
      - name: Construir
        run: pnpm build
